services:
  chromium:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}selenium/standalone-chromium:148.0.7778.178-chromedriver-148.0.7778.178-grid-4.44.0-20260505@sha256:8c5a8629c96104c0d73df94c6437af9ab9059c4e16aa32e35b330b7d77defe0b
    volumes:
      - /dev/shm:/dev/shm
    ports:
      - 4444:4444
      - 5900:5900
      - 7900:7900
    healthcheck:
      test: /opt/bin/check-grid.sh
      interval: 5s
      start_period: 5s
  dusk:
    extends:
      file: compose.yaml
      service: php-fpm
    command: php artisan dusk --without-tty
    volumes:
      - ./database:/var/www/database
      - ./tests:/var/www/tests
    environment:
      DUSK_DRIVER_URL: chromium:4444
      TELESCOPE_ENABLED: false
    depends_on:
      caddy:
        condition: service_started
      chromium:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    restart: no
secrets:
  .env:
    file: .env.dusk.compose
