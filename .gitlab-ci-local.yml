workflow:
  rules:
    - if: $GITLAB_CI == 'false'

variables:
  DOCKERHUB_IMAGE_PREFIX: ""

# gitlab-ci-local has no project registry to pull from, so jobs run against
# images built and loaded by hand:
#
#   nix build .#ci-image --out-link /tmp/ci-image
#   docker load --input /tmp/ci-image
#   nix build .#ci-browser-image --out-link /tmp/ci-browser-image
#   docker load --input /tmp/ci-browser-image
#
# Both land as <name>:latest, which is what the overrides below point at.
# PULL_POLICY=if-not-present in .gitlab-ci-local-env keeps docker from looking
# for them anywhere else.
.ci:
  image: roomz-ci:latest
  rules:
    - if: $GITLAB_CI == 'false'

browser:
  image: roomz-ci-browser:latest

# Builds and pushes to the project registry, which does not exist here. Run
# the two nix build commands above instead.
ci-image:
  rules:
    - if: $GITLAB_CI == 'false'
      when: never

# install:deps overrides `.ci`'s rules to drive CACHE_POLICY, so the override
# above no longer reaches it. Mirror the real behaviour: restore only, unless
# REBUILD_CACHE is passed (`gitlab-ci-local --variable REBUILD_CACHE=true`).
install:deps:
  rules:
    - if: $GITLAB_CI == 'false' && $REBUILD_CACHE == 'true'
      variables:
        CACHE_POLICY: pull-push
    - if: $GITLAB_CI == 'false'
