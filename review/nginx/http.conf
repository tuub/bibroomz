# Include in the nginx http context.
# Review apps (review/review-app.sh) are served from a shared document root of
# per-branch symlinks, so this one static configuration serves every branch:
# /review/<slug>/ resolves to /srv/review/apps/<slug>/public/ and deploying a
# branch never requires editing nginx.
map $uri $review_slug {
    ~^/review/(?<slug>[a-z0-9][a-z0-9-]*)(/|$) $slug;
    default                                    "";
}
