# Include in the staging server context to serve every review app.
# Restrict branch code to trusted networks (allow/deny or auth_basic) on a
# publicly reachable host.
location ^~ /review/ {
    root /srv/review/www;
    index index.php;

    # This prefix location takes precedence over the server-level regex
    # locations, so the dotfile guard has to be repeated here, and first:
    # nginx picks the first matching nested regex location.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Reserve 6100-6199 exclusively for review Reverb listeners. The build
    # embeds its assigned port in the websocket path, so deploying an app
    # requires no nginx edits or reloads. Only /app/ websocket requests can
    # reach this fixed loopback range; other local ports remain inaccessible.
    location ~ ^/review/[a-z0-9-]+/reverb/(?<review_reverb_port>61[0-9][0-9])(?<review_reverb_uri>/app/.*)$ {
        proxy_pass http://127.0.0.1:$review_reverb_port$review_reverb_uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # SCRIPT_FILENAME is built from $document_root, not $realpath_root: the
    # real path resolves through the symlink to .../apps/<slug>/public,
    # which no longer contains the /review/<slug> part of the script name.
    location ~ ^/review/[a-z0-9-]+/.*\.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        include fastcgi_params;
    }

    try_files $uri $uri/ /review/$review_slug/index.php?$query_string;
}
