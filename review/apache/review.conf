# Review apps under Apache. Include this inside the staging <VirtualHost>,
# before the staging websocket RewriteRule, so review websockets match here
# instead of falling through to staging's own Reverb listener.
#
# This is the counterpart of review/nginx/{http,server}.conf. Like those, it
# serves every branch from one static configuration: review/review-app.sh
# publishes /srv/review/www/review/<slug> as a symlink to that branch's
# public/, so deploying a branch never edits or reloads the web server.
#
# Requires mod_alias, mod_rewrite, mod_proxy, mod_proxy_http,
# mod_proxy_wstunnel and mod_proxy_fcgi.
#
# On a publicly reachable host, restrict branch code to trusted networks by
# replacing the "Require all granted" below with, for example:
#     Require ip 130.149.0.0/16

RewriteEngine On

# Reserve 6100-6199 exclusively for review Reverb listeners. The build embeds
# its assigned port in the websocket path, so deploying an app requires no
# Apache edits or reloads. Only /app/ requests can reach this fixed loopback
# range; other local ports and Reverb's API remain inaccessible.
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/review/[a-z0-9][a-z0-9-]*/reverb/(61[0-9][0-9])/(app/.*)$ ws://127.0.0.1:$1/$2 [P,L,QSA]
RewriteRule ^/review/[a-z0-9][a-z0-9-]*/reverb/(61[0-9][0-9])/(app/.*)$ http://127.0.0.1:$1/$2 [P,L,QSA]

# The shared document root, whose layout matches the URL.
Alias /review /srv/review/www/review

<Directory "/srv/review/www/review">
    # Following the per-branch symlinks is the whole mechanism; the bare
    # keyword also leaves Indexes and MultiViews off.
    Options FollowSymLinks

    # Laravel's public/.htaccess sets no RewriteBase, so under an Alias its
    # front controller resolves against the filesystem path rather than
    # /review/<slug>. The rules below replace it, and no checked-out branch
    # can override the configuration of a shared document root.
    AllowOverride None
    Require all granted

    DirectoryIndex index.php

    RewriteEngine On
    RewriteBase /review

    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} (.+)/$
    RewriteRule ^ %1 [L,R=301]

    # A missing .php file is a 404 here, as nginx's "try_files $uri =404"
    # makes it, instead of a front controller request for Laravel to reject.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^[a-z0-9][a-z0-9-]*/.*\.php$ - [R=404,L]

    # Every branch has its own front controller, picked by the first segment.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^([a-z0-9][a-z0-9-]*)(/.*)?$ $1/index.php [L]

    # SCRIPT_FILENAME keeps the symlinked /review/<slug> path instead of the
    # real one under apps/<slug>/public, as in the nginx configuration. The
    # -f guard stands in for nginx's "try_files $uri =404": without it, a
    # request for a missing .php file is answered by PHP-FPM itself.
    <FilesMatch "\.php$">
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </If>
    </FilesMatch>
</Directory>

# Dotfiles stay inaccessible, .well-known aside. A <LocationMatch> is checked
# after the <Directory> above, so this also covers the rewritten requests.
<LocationMatch "^/review/.*/\.(?!well-known)">
    Require all denied
</LocationMatch>
