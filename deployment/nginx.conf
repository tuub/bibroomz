# Put this map in the nginx http context. On Debian-style systems, files in
# sites-enabled are included from the http context, so keeping it beside the
# server block is valid.
#
# Only forward websocket upgrade headers to the Reverb backend. Forwarding
# arbitrary Upgrade values can expose h2c-style proxy-smuggling paths.
map $http_upgrade $websocket_upgrade {
    ~*^websocket$ websocket;
    default '';
}

map $http_upgrade $connection_upgrade {
    ~*^websocket$ upgrade;
    default close;
}

# Optional review apps: see review/README.md for installation.
# include /etc/nginx/roomz-review/http.conf;

server {
    listen 80;
    server_name roomz.example.org;

    # Redirect to the configured canonical server_name instead of reflecting the request Host header.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name roomz.example.org;

    root /srv/git/roomz/public;
    index index.php;

    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    access_log /var/log/nginx/roomz-access.log;
    error_log /var/log/nginx/roomz-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        # Keep the upstream Host fixed to server_name; do not pass attacker-controlled Host headers.
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # include /etc/nginx/roomz-review/server.conf;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
