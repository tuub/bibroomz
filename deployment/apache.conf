<VirtualHost *:443>
    ServerAdmin admin@example.org
    ServerName roomz.example.org

    DocumentRoot "/srv/git/roomz/public"

    SSLEngine On
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/privkey.pem

    <Directory "/srv/git/roomz/public">
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Optional review apps: see review/README.md for installation. The include
    # belongs here, ahead of the rule below, so review websockets reach their
    # own Reverb listener rather than staging's.
    # Include /etc/apache2/roomz-review/review.conf

    # Proxy websocket upgrade requests to Laravel Reverb.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteCond %{REQUEST_URI} !^/review/
    RewriteRule ^/(.*)$ ws://127.0.0.1:6001/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/roomz-error.log
    CustomLog ${APACHE_LOG_DIR}/roomz-access.log combined
</VirtualHost>
