---
x-environment: &env
  DB_HOST: mariadb
  REDIS_HOST: redis
  REDIS_PASSWORD: ""
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: mailpit
  REVERB_SCHEME: http
  REVERB_HOST: reverb
  REVERB_PORT: 6001

# NOTE: YAML merge keys (<<) are shallow. If a service adds its own `depends_on`
# block it will fully replace this anchor's entries, silently dropping the
# mariadb/redis health gates. Merge all dependencies explicitly in that case.
x-php: &php
  build:
    target: frankenphp
    args:
      DOCKERHUB_IMAGE_PREFIX: ${DOCKERHUB_IMAGE_PREFIX:-}
    secrets:
      - .env
  secrets:
    - source: .env
      target: /var/www/.env
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    <<: *env
  restart: unless-stopped
  init: true

services:
  frankenphp:
    <<: *php
    volumes:
      - frankenphp-data:/data
      - .docker/frankenphp/Caddyfile.${APP_SCHEME:-http}:/etc/frankenphp/Caddyfile
    environment:
      <<: *env
      APP_URL: ${APP_URL?}
    ports:
      - ${APP_PORT:-8000}:${APP_PORT:-8000}
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/app
        - action: sync
          path: ./database
          target: /var/www/database
  queue-worker:
    <<: *php
    command: ["php", "artisan", "queue:work"]
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'queue:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  schedule-worker:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'schedule:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start"]
    environment:
      <<: *env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --write-out '%{http_code}' --output /dev/null http://localhost:6001 | grep -qvE '^5'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  mariadb:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}mariadb:10.11.17-jammy@sha256:8acd4a5561e8897cfc8a99480f25bcecb10b726fa17b1ec7381c6ef36fa00a79
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: true
      MARIADB_DATABASE: ${DB_DATABASE:-bibroomz}
      MARIADB_USER: ${DB_USERNAME:-bibroomz}
      MARIADB_PASSWORD: ${DB_PASSWORD?}
    volumes:
      - mariadb-data:/var/lib/mysql
      - .docker/mariadb/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 127.0.0.1:3306:3306
  redis:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}redis:7.4.9-bookworm@sha256:d3be87a1060455213a204d2b0a7f04d45d19a16a98e85b3c37b7c33b5f0c489e
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - 127.0.0.1:6379:6379
  mailpit:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}axllent/mailpit:v1.30.1@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /mailpit
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8025$${MP_WEBROOT}/api/v1/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
volumes:
  frankenphp-data:
  mailpit-data:
  mariadb-data:
  redis-data:
secrets:
  .env:
    file: .env
