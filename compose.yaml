---
x-environment: &env
  DB_HOST: mariadb
  REDIS_HOST: redis
  REDIS_PASSWORD: ""
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: mailpit
  REVERB_SCHEME: http
  REVERB_HOST: reverb
  REVERB_PORT: 6001

services:
  php-fpm:
    build:
      target: php-fpm
      args:
        DOCKERHUB_IMAGE_PREFIX: ${DOCKERHUB_IMAGE_PREFIX:-}
      secrets:
        - .env
    volumes:
      - php-fpm-socket:/var/run/php
      - .docker/php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    secrets:
      - source: .env
        target: /var/www/.env
    depends_on:
      - mariadb
      - redis
    environment:
      <<: *env
    restart: unless-stopped
    init: true
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/app
        - action: sync
          path: ./database
          target: /var/www/database
  queue-worker:
    extends: php-fpm
    command: php artisan queue:work
  schedule-worker:
    extends: php-fpm
    command: php artisan schedule:work
  reverb:
    extends: php-fpm
    command: php artisan reverb:start
    environment:
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
  caddy:
    build:
      target: caddy
      args:
        DOCKERHUB_IMAGE_PREFIX: ${DOCKERHUB_IMAGE_PREFIX:-}
      secrets:
        - .env
    volumes:
      - caddy-config:/config
      - caddy-data:/data
      - php-fpm-socket:/var/run/php
      - .docker/caddy:/etc/caddy
      - .docker/caddy/Caddyfile.${APP_SCHEME:-https}:/etc/caddy/Caddyfile
    depends_on:
      - php-fpm
      - queue-worker
      - schedule-worker
      - reverb
    environment:
      APP_URL: ${APP_URL?}
    ports:
      - ${APP_PORT:-8000}:${APP_PORT:-8000}
  mariadb:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}mariadb:10.11.17-jammy@sha256:8acd4a5561e8897cfc8a99480f25bcecb10b726fa17b1ec7381c6ef36fa00a79
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: true
      MARIADB_DATABASE: ${DB_DATABASE:-bibroomz}
      MARIADB_USER: ${DB_USERNAME:-bibroomz}
      MARIADB_PASSWORD: ${DB_PASSWORD?}
    volumes:
      - mariadb-data:/var/lib/mysql
      - .docker/mariadb/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      interval: 5s
      start_period: 5s
    # ports:
    #   - 3306:3306
  redis:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}redis:7.4.9-bookworm@sha256:d3be87a1060455213a204d2b0a7f04d45d19a16a98e85b3c37b7c33b5f0c489e
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      start_period: 5s
    # ports:
    #   - 6379:6379
  mailpit:
    image: ${DOCKERHUB_IMAGE_PREFIX:-}axllent/mailpit:v1.30.1@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /mailpit
    volumes:
      - mailpit-data:/data
    healthcheck:
      disable: true
    # ports:
    #   - 1025:1025
    #   - 8025:8025
volumes:
  caddy-config:
  caddy-data:
  mailpit-data:
  mariadb-data:
  php-fpm-socket:
  redis-data:
secrets:
  .env:
    file: .env
