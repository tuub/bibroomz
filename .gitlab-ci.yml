# Script-block comments quote a command as 'ort evaluate' rather than with
# backticks: gitlab-ci-local echoes a collapsed block through double quotes and
# would run whatever the backticks enclose. Comments outside a script are free.

# The stages live in .gitlab/ci/, one file each. `extends:` and `!reference`
# reach across these boundaries; a YAML anchor does not, so every anchor below
# is consumed in this file and offered to the others as a template.
include:
  - local: .gitlab/ci/automation.yml
  - local: .gitlab/ci/image.yml
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/deploy.yml
  - local: review/gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    # The only tags that get a pipeline are the ones npm:publish reacts to, so
    # no other tag creates a pipeline without a single job in it.
    - if: $CI_COMMIT_TAG =~ /^vite-plugin-third-party-notices@/

stages:
  - automation
  - image
  - install
  - lint
  - build
  - test
  - deploy

variables:
  # Set this to "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" in CI variables
  # to route Docker Hub pulls through the GitLab dependency proxy.
  DOCKERHUB_IMAGE_PREFIX: ""
  # The frontend bundle has APP_URL (via ziggy:generate) and VITE_REVERB_PORT
  # compiled into it, so frontend-build and the browser job reusing its
  # artifact have to agree on both ports up front.
  BROWSER_REVERB_PORT: "6001"
  BROWSER_SERVER_PORT: "8000"

default:
  interruptible: true

### Cache fragments
# node_modules/ and vendor/ stay in the GitLab cache rather than in the image.
# Baking them in would key the image on three lock files instead of one, and
# those two moved 39 times over the last 90 days: rebuilding and pushing ~1 GiB
# on every dependency bump, to save a cache restore, and making the merge
# request that has to build its own image the common case rather than the rare
# one. No fallback_keys on either: a stale hit here would be silently wrong
# rather than merely slow.
.cache-node: &cache-node
  key:
    files:
      - package-lock.json
    prefix: node
  paths:
    - node_modules/
  policy: pull

.cache-composer: &cache-composer
  key:
    files:
      - composer.lock
    prefix: composer
  paths:
    - vendor/
  policy: pull

# PHPStan's result cache, which turns a two-minute full analysis into seconds.
# Keyed on nothing, unlike the two above, because the cache file carries its own
# metadata -- phpstan.neon, composer.lock, Composer's installed.php, the PHP
# version and a hash per analysed file -- and re-analyses as much as the
# differences reach, from one file up to everything. A stale hit is slow at
# worst, never wrong, so a dependency bump re-checks the files that depend on the
# bumped package instead of starting from zero. 92 MiB of mostly per-file parse
# caches, under 4 MiB once the runner has zipped it.
.cache-phpstan: &cache-phpstan
  key: phpstan-result-cache
  paths:
    - .phpstan-cache/
  policy: pull-push

# Pint validates its cache the same way: the file records the PHP version, the
# PHP-CS-Fixer version and every resolved rule, and a mismatch discards it.
.cache-pint: &cache-pint
  key: pint-cache
  paths:
    - .pint-cache
  policy: pull-push

# Rector cannot be trusted that far, so its key carries composer.lock instead.
# It hashes rector.php, its rules and its sets, but not the version of the
# package a rule comes from: a bump that changes what a rule reports would
# otherwise be served a cache that says the file was clean. A changed lock file
# starts it cold, which is what the lint job does today anyway.
.cache-rector: &cache-rector
  key:
    files:
      - composer.lock
    prefix: rector
  paths:
    - .rector-cache/
  policy: pull-push

### Cache sets
# A job-level cache replaces the inherited one rather than adding to it, so a job
# that wants one of the tool caches above has to restate vendor/ alongside it.
# The combined lists live here, next to the anchors they are built from, and the
# lint jobs reach them with `!reference`.
.cache-set-phpstan:
  cache:
    - *cache-composer
    - *cache-phpstan

.cache-set-pint:
  cache:
    - *cache-composer
    - *cache-pint

.cache-set-rector:
  cache:
    - *cache-composer
    - *cache-rector

### Cache recovery
# The GitLab cache is best effort, so an evicted cache arrives here as an empty
# directory even when install:deps populated it in an earlier pipeline.
# Reinstalling costs about a minute; failing costs the whole pipeline.
.restore-node:
  script:
    - |
      if [ ! -d node_modules ]; then
        echo "node_modules/ was not restored from the cache; installing it."
        npm ci --ignore-scripts
      fi

.restore-composer:
  script:
    - |
      if [ ! -d vendor ]; then
        echo "vendor/ was not restored from the cache; installing it."
        composer install --no-interaction --quiet
      fi

### Base images
# No before_script and no cache of its own: the toolchain is the image.
# CI_IMAGE_TAG comes from ci-image's dotenv report, so a job extending this
# that sets `needs` has to list ci-image there too. Optional only because
# gitlab-ci-local has no registry and drops ci-image.
.ci:
  image: $CI_REGISTRY_IMAGE/roomz-ci:$CI_IMAGE_TAG
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Node tooling only: no vendor/.
.ci-node:
  extends: .ci
  cache:
    - *cache-node
  before_script:
    - !reference [.restore-node, script]

# PHP tooling only: no node_modules/.
.ci-php:
  extends: .ci
  cache:
    - *cache-composer
  before_script:
    - !reference [.restore-composer, script]

.ci-full:
  extends: .ci
  cache:
    - *cache-node
    - *cache-composer
  before_script:
    - !reference [.restore-node, script]
    - !reference [.restore-composer, script]

### install stage
install:deps:
  extends: .ci
  stage: install
  needs:
    - job: ci-image
      optional: true
  variables:
    # Also gives static/local CI parsers a valid cache policy before rules are
    # evaluated; every GitLab path that pushes replaces it below.
    CACHE_POLICY: pull
  rules:
    # A new toolchain is reason enough to reinstall against it.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - flake.nix
        - flake.lock
      variables:
        CACHE_POLICY: pull-push
    # Exercise changes to the installer without overwriting lock-keyed caches.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - .gitlab-ci.yml
      variables:
        CACHE_POLICY: pull
    # Everything merges here, so this is what keeps the caches that merge
    # requests branch from alive, and it recovers an evicted cache without
    # anyone noticing. It is off the critical path of merge request feedback.
    # Push only, so the unrelated schedules on this branch do not match it.
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    # A backstop for the case where nothing has merged in a while. Needs a
    # pipeline schedule with SCHEDULE_TASK=warm-cache.
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'warm-cache'
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - composer.lock
        - package-lock.json
      variables:
        CACHE_POLICY: pull-push
    # For refilling a wiped cache right now rather than waiting for the next
    # merge or the nightly schedule. Run a pipeline with REBUILD_CACHE=true.
    - if: $REBUILD_CACHE == 'true'
      variables:
        CACHE_POLICY: pull-push
  cache:
    - <<: *cache-composer
      policy: $CACHE_POLICY
    - <<: *cache-node
      policy: $CACHE_POLICY
  script:
    - composer install --no-interaction --quiet
    - npm ci --ignore-scripts
