workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

include:
  component: $CI_SERVER_FQDN/ub/onit/gitlab-ci-components/dependency-scanning@main

stages:
  - automation
  - build
  - lint
  - test
  - deploy

variables:
  # Route Docker Hub pulls through the GitLab dependency proxy in CI.
  DOCKERHUB_IMAGE_PREFIX:
    value: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"
    expand: true

default:
  interruptible: true

### Automation stage
dependabot:
  stage: automation
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - apk add --no-cache curl jq
    - |
      TARGET_BRANCH="${CI_DEFAULT_BRANCH}"

      existing="$(curl --silent --show-error \
        --get \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "state=opened" \
        --data-urlencode "source_branch=$CI_COMMIT_BRANCH" \
        --data-urlencode "target_branch=$TARGET_BRANCH" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"

      iid="$(echo "$existing" | jq -r '.[0].iid // empty')"

      if [ -z "$iid" ]; then
        created="$(curl --silent --show-error --fail \
          --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data-urlencode "source_branch=$CI_COMMIT_BRANCH" \
          --data-urlencode "target_branch=$TARGET_BRANCH" \
          --data-urlencode "title=chore(deps): $CI_COMMIT_BRANCH" \
          --data-urlencode "remove_source_branch=true" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"
        iid="$(echo "$created" | jq -r '.iid')"
      fi

      curl --silent --show-error --fail \
        --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "auto_merge=true" \
        --data-urlencode "should_remove_source_branch=true" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$iid/merge"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/

### Base images
.node:
  image: ${DOCKERHUB_IMAGE_PREFIX}node:22.22.3-alpine3.23@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920
  cache:
    - key:
        files:
          - package-lock.json
        prefix: node
      paths:
        - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.php:
  image: ${DOCKERHUB_IMAGE_PREFIX}php:8.3.31-alpine3.23@sha256:2e6b46e0c087cc1c17cfd91172112d8d9db5cbf9503b20e3418c10bd198748b5
  cache:
    - key:
        files:
          - composer-lock.json
        prefix: composer
      paths:
        - vendor/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.deploy:
  stage: deploy
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  before_script:
    - apk add --update openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh "${SSH_USER}@${SSH_HOSTNAME}" bash -ex <<EOT
      cd $SSH_GIT_DIR
      git fetch $CI_REPOSITORY_URL $CI_COMMIT_SHA
      git checkout FETCH_HEAD
      scripts/deploy.sh $BUILD_PREFIX
      EOT
  resource_group: $SSH_HOSTNAME
  interruptible: false
  when: manual

### Build stage
composer:
  extends: .php
  stage: build
  before_script:
    - EXPECTED_CHECKSUM="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
    - test "$EXPECTED_CHECKSUM" == "$ACTUAL_CHECKSUM"
    - php composer-setup.php
  script:
    - php composer.phar install --ignore-platform-reqs

node:
  extends: .node
  stage: build
  before_script:
    - apk add --no-cache git
  script:
    - npm ci --ignore-scripts

### Lint stage
commitlint:
  extends: .node
  stage: lint
  script:
    - npx --no -- commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA

eslint:
  extends: .node
  stage: lint
  script:
    - npx --no -- eslint resources/js/**/*.{js,ts,vue}

gitleaks:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script: gitleaks git --platform=gitlab --log-opts=$CI_MERGE_REQUEST_DIFF_BASE_SHA..
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

phpcs:
  extends: .php
  stage: lint
  script:
    - vendor/bin/phpcs

prettier:
  extends: .node
  stage: lint
  script:
    - npx --no -- prettier --list-different resources/js resources/sass

renovate:
  extends: .node
  stage: lint
  script:
    - npx --no --package renovate -- renovate-config-validator --strict

stylelint:
  extends: .node
  stage: lint
  script:
    - npx --no -- stylelint resources/{js,sass}/**/*.{css,sass,vue}

### Test stage
dusk:
  stage: test
  image: ${DOCKERHUB_IMAGE_PREFIX}docker:26.1.4-cli@sha256:f13cbf1ea352bdbdc825a9233fc56716bdf818e4f608f63280a1aa0b3dc1f2f7
  services:
    - ${DOCKERHUB_IMAGE_PREFIX}docker:26.1.4-dind@sha256:dd43b430341a40d88f4f30edb03865daa9d6fa39c9b1da70f27e2a89cec3eae1
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      if [ -n "${DOCKERHUB_IMAGE_PREFIX:-}" ]; then
        if [ -n "${CI_DEPENDENCY_PROXY_SERVER:-}" ] && [ -n "${CI_DEPENDENCY_PROXY_USER:-}" ] && [ -n "${CI_DEPENDENCY_PROXY_PASSWORD:-}" ]; then
          printf '%s' "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" --username "$CI_DEPENDENCY_PROXY_USER" --password-stdin
        else
          echo "DOCKERHUB_IMAGE_PREFIX is set but CI_DEPENDENCY_PROXY credentials are unavailable." >&2
          exit 1
        fi
      elif [ -n "${DOCKER_REGISTRY_USER:-}" ] && [ -n "${DOCKER_REGISTRY_PASS:-}" ]; then
        printf '%s' "$DOCKER_REGISTRY_PASS" | docker login --username "$DOCKER_REGISTRY_USER" --password-stdin
      else
        echo "Skipping Docker registry login; no dependency proxy or registry credentials are available in this pipeline."
      fi
    - cp .env.dusk.compose .env
  script:
    - docker compose --file compose.testing.yaml up --abort-on-container-exit --exit-code-from dusk --attach dusk
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  resource_group: project-pipeline

### Deploy stage
deploy-staging:
  extends: .deploy
  environment:
    name: staging
    url: https://roomz.onit-ub.tu-berlin.de

deploy-demo:
  extends: .deploy
  environment:
    name: demo
    url: https://demo.ub.tu-berlin.de/bibroomz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  manual_confirmation: Deploy to demo server?
