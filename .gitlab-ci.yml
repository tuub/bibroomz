workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

include:
  component: $CI_SERVER_FQDN/ub/onit/gitlab-ci-components/dependency-scanning@main

stages:
  - automation
  - install
  - lint
  - build
  - test
  - deploy

variables:
  # Route Docker Hub pulls through the GitLab dependency proxy in CI.
  DOCKERHUB_IMAGE_PREFIX:
    value: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"
    expand: true

default:
  interruptible: true

### Automation stage
dependabot:
  stage: automation
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - apk add --no-cache curl jq
    - |
      TARGET_BRANCH="${CI_DEFAULT_BRANCH}"

      existing="$(curl --silent --show-error \
        --get \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "state=opened" \
        --data-urlencode "source_branch=$CI_COMMIT_BRANCH" \
        --data-urlencode "target_branch=$TARGET_BRANCH" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"

      iid="$(echo "$existing" | jq --raw-output '.[0].iid // empty')"

      if [ -z "$iid" ]; then
        created="$(curl --silent --show-error --fail \
          --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data-urlencode "source_branch=$CI_COMMIT_BRANCH" \
          --data-urlencode "target_branch=$TARGET_BRANCH" \
          --data-urlencode "title=chore(deps): $CI_COMMIT_BRANCH" \
          --data-urlencode "remove_source_branch=true" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"
        iid="$(echo "$created" | jq --raw-output '.iid')"
      fi

      curl --silent --show-error --fail \
        --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "auto_merge=true" \
        --data-urlencode "should_remove_source_branch=true" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$iid/merge"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/

### Base images
.nix:
  image: ${DOCKERHUB_IMAGE_PREFIX}nixos/nix:2.34.7@sha256:898e3874bc80a8fbd7df6001b6c83d6e0c904a942e3a4cdf8a89881458333cac
  variables:
    NIX_CONFIG: "extra-experimental-features = nix-command flakes"
  cache:
    - key:
        files:
          - flake.lock
          - flake.nix
        prefix: nix-store
      paths:
        - .nix-cache/
      policy: pull
    - key:
        files:
          - package-lock.json
        prefix: node
      paths:
        - node_modules/
      policy: pull
    - key:
        files:
          - composer.lock
        prefix: composer
      paths:
        - vendor/
      policy: pull
  before_script:
    - mkdir --parents .nix-cache
    - echo "extra-substituters = file://$PWD/.nix-cache" >> /etc/nix/nix.conf
    - echo "extra-trusted-substituters = file://$PWD/.nix-cache" >> /etc/nix/nix.conf

  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.deploy:
  stage: deploy
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  before_script:
    - apk add --update openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh "${SSH_USER}@${SSH_HOSTNAME}" bash -o errexit -o xtrace <<EOT
      cd $SSH_GIT_DIR
      git fetch $CI_REPOSITORY_URL $CI_COMMIT_SHA
      git checkout FETCH_HEAD
      scripts/deploy.sh $BUILD_PREFIX
      EOT
  resource_group: $SSH_HOSTNAME
  interruptible: false
  when: manual

### install stage
install:nix:
  extends: .nix
  stage: install
  needs: []
  cache:
    - key:
        files:
          - flake.lock
          - flake.nix
        prefix: nix-store
      paths:
        - .nix-cache/
      policy: pull-push
    - key:
        files:
          - composer.lock
        prefix: composer
      paths:
        - vendor/
      policy: pull-push
    - key:
        files:
          - package-lock.json
        prefix: node
      paths:
        - node_modules/
      policy: pull-push
  script:
    - nix develop --command composer install --no-interaction --quiet
    - nix develop --command npm ci --ignore-scripts
    - nix build .#devShells.x86_64-linux.default --no-link
    - |
      nix path-info --recursive .#devShells.x86_64-linux.default \
        | xargs nix copy --to "file://$CI_PROJECT_DIR/.nix-cache" --no-check-sigs

### Lint stage
commitlint:
  extends: .nix
  stage: lint
  script:
    - nix develop --command node_modules/.bin/commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA

eslint:
  extends: .nix
  stage: lint
  script:
    - nix develop --command node_modules/.bin/eslint resources/

gitleaks:
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  stage: lint
  needs: []
  script: gitleaks git --platform=gitlab --log-opts=$CI_MERGE_REQUEST_DIFF_BASE_SHA..
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

phpcs:
  extends: .nix
  stage: lint
  script:
    - nix develop --command vendor/bin/phpcs

phpstan:
  extends: .nix
  stage: lint
  script:
    - nix develop --command vendor/bin/phpstan --no-progress

prettier:
  extends: .nix
  stage: lint
  script:
    - nix develop --command node_modules/.bin/prettier --list-different resources/

stylelint:
  extends: .nix
  stage: lint
  script:
    - nix develop --command node_modules/.bin/stylelint resources/

frontend-build:
  extends: .nix
  stage: build
  needs:
    - install:nix
  script:
    - nix develop --command scripts/build-frontend-assets.sh
  artifacts:
    expire_in: 1 week
    paths:
      - public/build/

### Test stage
unit-coverage:
  extends: .nix
  stage: test
  coverage: '/Total:\s+(\d+(?:\.\d+)?)\s*\%/'
  needs:
    - job: frontend-build
      artifacts: true
  script:
    - mkdir --parents build/coverage
    - |
      nix develop --command composer run coverage:unit

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura-unit.xml
    paths:
      - build/coverage/

feature-coverage:
  extends: .nix
  stage: test
  coverage: '/Total:\s+(\d+(?:\.\d+)?)\s*\%/'
  needs:
    - job: frontend-build
      artifacts: true
  script:
    - mkdir --parents build/coverage
    - |
      nix develop --command composer run coverage:feature
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura-feature.xml
    paths:
      - build/coverage/

browser:
  extends: .nix
  stage: test
  script:
    - nix develop --command composer run test:browser

### Deploy stage
deploy-staging:
  extends: .deploy
  environment:
    name: staging
    url: https://roomz.onit-ub.tu-berlin.de

deploy-demo:
  extends: .deploy
  environment:
    name: demo
    url: https://demo.ub.tu-berlin.de/bibroomz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  manual_confirmation: Deploy to demo server?
