include:
  - local: review/gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

stages:
  - automation
  - image
  - install
  - lint
  - build
  - test
  - deploy

variables:
  # Set this to "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" in CI variables
  # to route Docker Hub pulls through the GitLab dependency proxy.
  DOCKERHUB_IMAGE_PREFIX: ""
  # The frontend bundle has APP_URL (via ziggy:generate) and VITE_REVERB_PORT
  # compiled into it, so frontend-build and the browser job reusing its
  # artifact have to agree on both ports up front.
  BROWSER_REVERB_PORT: "6001"
  BROWSER_SERVER_PORT: "8000"
  # Which build of the CI images the pipeline runs on. Overridden per job by
  # the .flake-changed rule below; see the ci-image job for the whole scheme.
  CI_IMAGE_TAG: main

default:
  interruptible: true

### Automation stage
dependabot:
  stage: automation
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - apk add --no-cache curl jq
    - scripts/dependabot-merge-request.sh
    - scripts/prune-mirror-branches.sh
    - scripts/stale-pull-requests.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/

### Image stage
# The toolchain used to arrive as a nix binary cache: every job restored a
# ~284 MiB archive and had `nix develop` unpack it into a ~943 MiB store of its
# own, thirteen times a pipeline. It ships as an image instead, so the runner
# keeps it between jobs and pipelines and the jobs below start with php, node
# and composer already on PATH. Both images come out of flake.nix, from the
# same package list the devshell is built from, so the two cannot drift.
#
# `main` is the only tag the pipeline normally reads, and it moves only when
# flake.nix or flake.lock does -- in practice about weekly, since
# .github/workflows/update-flake-lock.yml proposes a nixpkgs bump every Monday.
# A merge request that edits either builds its own `mr-<iid>` tag first,
# because the image it needs does not exist yet anywhere else. That build is
# on the critical path of that one merge request, which is a dependency bump
# nobody is waiting on.
#
# Unlike the caches this replaced, a missing image is fatal rather than slow:
# jobs cannot start at all. Two things keep `main` alive -- it is rebuilt on
# the default branch whenever the flake moves, and the warm-cache schedule
# re-pushes it weekly so a registry cleanup policy does not age it out. If it
# does go missing -- or does not exist yet, on a fresh registry -- run a
# pipeline with REBUILD_IMAGE=true. The merge request that first added this
# touches flake.nix, so it bootstraps itself: it builds `mr-<iid>` to run on,
# and pushes `main` when it merges.
.flake-changed: &flake-changed
  if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  changes:
    - flake.nix
    - flake.lock
  variables:
    CI_IMAGE_TAG: mr-$CI_MERGE_REQUEST_IID

ci-image:
  stage: image
  image: ${DOCKERHUB_IMAGE_PREFIX}nixos/nix:2.34.7@sha256:898e3874bc80a8fbd7df6001b6c83d6e0c904a942e3a4cdf8a89881458333cac
  needs: []
  variables:
    NIX_CONFIG: "extra-experimental-features = nix-command flakes"
  rules:
    - <<: *flake-changed
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - flake.nix
        - flake.lock
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'warm-cache'
    # Republishes `main` from whatever the flake currently pins. Reached only
    # when the flake did not change, so the image it pushes is the one the
    # default branch would have pushed anyway -- which is what makes it safe
    # to run from a merge request to repair a missing tag.
    - if: $REBUILD_IMAGE == 'true'
  script:
    - nix build .#ci-image --out-link /tmp/ci-image
    - nix build .#ci-browser-image --out-link /tmp/ci-browser-image
    - |
      # skopeo comes from this flake's pinned nixpkgs rather than the ambient
      # registry, and it pushes straight from the archive nix just built --
      # no docker daemon and no dind service anywhere in this job.
      #
      # --insecure-policy because skopeo refuses to run at all without a
      # trust policy, and this container has no /etc/containers/policy.json.
      # It governs what skopeo is willing to *read*; both sides here are the
      # archive nix just built and a registry this job authenticates to.
      publish() {
        nix shell .#skopeo --command skopeo --insecure-policy copy \
          --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          "docker-archive:$1" \
          "docker://$2:$CI_IMAGE_TAG"
      }

      # buildLayeredImage splits the closure across 120 layers, so a nixpkgs
      # bump re-uploads the store paths that moved and skips the rest.
      publish /tmp/ci-image "$CI_REGISTRY_IMAGE/roomz-ci"
      publish /tmp/ci-browser-image "$CI_REGISTRY_IMAGE/roomz-ci-browser"

### Cache fragments
# node_modules/ and vendor/ stay in the GitLab cache rather than in the image.
# Baking them in would key the image on three lock files instead of one, and
# those two moved 39 times over the last 90 days: rebuilding and pushing ~1 GiB
# on every dependency bump, to save a cache restore, and making the merge
# request that has to build its own image the common case rather than the rare
# one. No fallback_keys on either: a stale hit here would be silently wrong
# rather than merely slow.
.cache-node: &cache-node
  key:
    files:
      - package-lock.json
    prefix: node
  paths:
    - node_modules/
  policy: pull

.cache-composer: &cache-composer
  key:
    files:
      - composer.lock
    prefix: composer
  paths:
    - vendor/
  policy: pull

### Cache recovery
# The GitLab cache is best effort, and install:deps only pushes when a lock
# file moved, so an evicted cache arrives here as an empty directory.
# Reinstalling costs about a minute; failing costs the whole pipeline.
.restore-node:
  script:
    - |
      if [ ! -d node_modules ]; then
        echo "node_modules/ was not restored from the cache; installing it."
        npm ci --ignore-scripts
      fi

.restore-composer:
  script:
    - |
      if [ ! -d vendor ]; then
        echo "vendor/ was not restored from the cache; installing it."
        composer install --no-interaction --quiet
      fi

### Base images
# No before_script and no cache of its own: the toolchain is the image.
.ci:
  image: $CI_REGISTRY_IMAGE/roomz-ci:$CI_IMAGE_TAG
  rules:
    - <<: *flake-changed
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Node tooling only: no vendor/.
.ci-node:
  extends: .ci
  cache:
    - *cache-node
  before_script:
    - !reference [.restore-node, script]

# PHP tooling only: no node_modules/.
.ci-php:
  extends: .ci
  cache:
    - *cache-composer
  before_script:
    - !reference [.restore-composer, script]

.ci-full:
  extends: .ci
  cache:
    - *cache-node
    - *cache-composer
  before_script:
    - !reference [.restore-node, script]
    - !reference [.restore-composer, script]

.ssh:
  stage: deploy
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  needs: []
  before_script:
    - apk add --update openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  interruptible: false

.deploy:
  extends: .ssh
  script:
    - |
      ssh "${SSH_USER}@${SSH_HOSTNAME}" bash -o errexit -o xtrace <<EOT
      cd $SSH_GIT_DIR
      git fetch $CI_REPOSITORY_URL $CI_COMMIT_SHA
      git checkout FETCH_HEAD
      scripts/deploy.sh $BUILD_PREFIX
      EOT
  resource_group: $SSH_HOSTNAME
  when: manual

### install stage
install:deps:
  extends: .ci
  stage: install
  needs:
    # Only in the pipeline when the flake moved; every other pipeline runs
    # this job against the image already in the registry.
    - job: ci-image
      optional: true
  variables:
    # Both caches are keyed on nothing but the lock files listed in the rules
    # below, so when neither changed a push would overwrite an identical
    # object. Restoring is cheap and pushing is not, so the default is not to
    # push.
    CACHE_POLICY: pull
  rules:
    # A new toolchain is reason enough to reinstall against it, and the
    # image this runs on is the one ci-image just pushed.
    - <<: *flake-changed
      variables:
        CI_IMAGE_TAG: mr-$CI_MERGE_REQUEST_IID
        CACHE_POLICY: pull-push
    # Everything merges here, so this is what keeps the caches that merge
    # requests branch from alive, and it recovers an evicted cache without
    # anyone noticing. It is off the critical path of merge request feedback.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    # A backstop for the case where nothing has merged in a while. Needs a
    # pipeline schedule with SCHEDULE_TASK=warm-cache.
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'warm-cache'
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - composer.lock
        - package-lock.json
      variables:
        CACHE_POLICY: pull-push
    # For refilling a wiped cache right now rather than waiting for the next
    # merge or the nightly schedule. Run a pipeline with REBUILD_CACHE=true.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $REBUILD_CACHE == 'true'
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  cache:
    - <<: *cache-composer
      policy: $CACHE_POLICY
    - <<: *cache-node
      policy: $CACHE_POLICY
  script:
    - |
      if [ "$CACHE_POLICY" = pull ]; then
        # Nothing installed here would be uploaded, so the only work left worth
        # doing is checking that what the rest of the pipeline reads came back.
        missing=""

        [ -d vendor ] || missing="$missing vendor"
        [ -d node_modules ] || missing="$missing node_modules"

        if [ -n "$missing" ]; then
          # Not fatal: the lint and test jobs reinstall what they need, so the
          # pipeline is slower but still correct.
          echo "Not restored from the cache:$missing"
          echo "No lock file changed here, so this pipeline cannot refill it. The next"
          echo "default-branch pipeline or the warm-cache schedule will. To refill it"
          echo "now, re-run this pipeline with the variable REBUILD_CACHE=true."
          exit 0
        fi

        echo "Both caches restored, and no lock file changed. Nothing to install."
        exit 0
      fi

    - composer install --no-interaction --quiet
    - npm ci --ignore-scripts

### Lint stage
commitlint:
  extends: .ci-node
  stage: lint
  variables:
    GIT_DEPTH: "0"
  script:
    - node_modules/.bin/commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA

# tsconfig resolves ziggy-js inside vendor/, and type-aware rules follow
# that import, so this one needs both dependency caches.
eslint:
  extends: .ci-full
  stage: lint
  script:
    - npm run eslint

gitleaks:
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  stage: lint
  needs: []
  script: gitleaks git --platform=gitlab --log-opts=$CI_MERGE_REQUEST_DIFF_BASE_SHA..
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

phpstan:
  extends: .ci-php
  stage: lint
  script:
    - vendor/bin/phpstan --no-progress

pint:
  extends: .ci-php
  stage: lint
  script:
    - vendor/bin/pint --test

prettier:
  extends: .ci-node
  stage: lint
  script:
    - npm run format:check

rector:
  extends: .ci-php
  stage: lint
  script:
    - vendor/bin/rector --dry-run --no-progress-bar

stylelint:
  extends: .ci-node
  stage: lint
  script:
    - npm run stylelint

# vue-tsc resolves ziggy-js inside vendor/, so this one needs both caches too.
typescript:
  extends: .ci-full
  stage: lint
  script:
    - npm run typecheck

# vite shells out to `php artisan ziggy:generate` and aliases ziggy-js into
# vendor/, so this one needs both dependency caches.
frontend-build:
  extends: .ci-full
  stage: build
  needs:
    - install:deps
  variables:
    APP_URL: http://127.0.0.1:$BROWSER_SERVER_PORT
    VITE_REVERB_PORT: $BROWSER_REVERB_PORT
  script:
    - scripts/build-frontend-assets.sh
  artifacts:
    expire_in: 1 week
    paths:
      - public/build/

### Test stage
coverage:
  extends: .ci-php
  stage: test
  coverage: '/Total:\s+(\d+(?:\.\d+)?)\s*\%/'
  needs:
    - job: frontend-build
      artifacts: true
  script:
    - mkdir --parents build/coverage
    - composer run coverage

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura.xml
    paths:
      - build/coverage/

browser:
  extends: .ci-full
  stage: test
  # The only job that launches a browser, so the only one on the image that
  # carries the ~2 GiB Playwright closure on top of the shared toolchain.
  image: $CI_REGISTRY_IMAGE/roomz-ci-browser:$CI_IMAGE_TAG
  needs:
    - job: frontend-build
      artifacts: true
  variables:
    SKIP_FRONTEND_BUILD: "1"
  # Browser tests stall rather than slow down when the runner is busy, because
  # every Pest worker talks to one shared `playwright run-server`. Running a
  # single browser job at a time keeps the machine out of the state that
  # triggers it, at the cost of queueing this job across merge requests.
  resource_group: browser
  script:
    - composer run test:browser

vitest:
  extends: .ci-node
  stage: test
  needs:
    - install:deps
  script:
    - npm run test

### Deploy stage
deploy-staging:
  extends: .deploy
  environment:
    name: staging
    url: https://roomz.onit-ub.tu-berlin.de

deploy-demo:
  extends: .deploy
  environment:
    name: demo
    url: https://demo.ub.tu-berlin.de/bibroomz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  manual_confirmation: Deploy to demo server?

import-database:
  stage: deploy
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  needs: []
  environment:
    name: import-database
    action: access
  before_script:
    - apk add --update bash openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SOURCE_SSH_PRIVATE_KEY" "$TARGET_SSH_PRIVATE_KEY"
    - ssh-add "$SOURCE_SSH_PRIVATE_KEY"
    - ssh-add "$TARGET_SSH_PRIVATE_KEY"
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - cat "$SOURCE_SSH_KNOWN_HOSTS" "$TARGET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - scripts/db-import.sh
  resource_group: $TARGET_SSH_HOSTNAME
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'import-database'
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
