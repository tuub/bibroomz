include:
  - local: review/gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

stages:
  - automation
  - install
  - lint
  - build
  - test
  - deploy

variables:
  # Set this to "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" in CI variables
  # to route Docker Hub pulls through the GitLab dependency proxy.
  DOCKERHUB_IMAGE_PREFIX: ""
  # The frontend bundle has APP_URL (via ziggy:generate) and VITE_REVERB_PORT
  # compiled into it, so frontend-build and the browser job reusing its
  # artifact have to agree on both ports up front.
  BROWSER_REVERB_PORT: "6001"
  BROWSER_SERVER_PORT: "8000"

default:
  interruptible: true

### Automation stage
dependabot:
  stage: automation
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  script:
    - apk add --no-cache curl jq
    - scripts/dependabot-merge-request.sh
    - scripts/prune-mirror-branches.sh
    - scripts/stale-pull-requests.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH =~ /^dependabot\/.*/

### Cache fragments
# Every job used to pull all three caches. Restoring one is far from free --
# the devshell closure alone is ~940 MiB and node_modules is ~350 MiB -- so
# each job now pulls only what its script actually reads.
.cache-nix: &cache-nix
  key:
    files:
      - flake.lock
      - flake.nix
    prefix: nix-store
  # When a lock file moves the new key misses, and the job would rebuild from
  # cache.nixos.org. Falling back to the copy the default branch keeps means
  # nix fetches only the paths that actually changed. Safe here because store
  # paths are content addressed, so a stale hit costs a download and nothing
  # else -- deliberately not done for vendor/ or node_modules/, where a stale
  # hit would be silent and wrong.
  fallback_keys:
    - nix-store-main
  paths:
    - .nix-cache/
  policy: pull

# Closure-complete on its own: a binary cache has to be, so this repeats the
# default shell's paths rather than carrying only the Playwright difference.
# The browser job therefore restores this cache instead of .nix-cache, and no
# other job pays for the ~730 MiB it holds.
.cache-nix-browser: &cache-nix-browser
  key:
    files:
      - flake.lock
      - flake.nix
    prefix: nix-store-browser
  fallback_keys:
    - nix-store-browser-main
  paths:
    - .nix-browser-cache/
  policy: pull

.cache-node: &cache-node
  key:
    files:
      - package-lock.json
    prefix: node
  paths:
    - node_modules/
  policy: pull

.cache-composer: &cache-composer
  key:
    files:
      - composer.lock
    prefix: composer
  paths:
    - vendor/
  policy: pull

### Cache recovery
# The GitLab cache is best effort, and install:nix only pushes when a lock file
# moved, so an evicted cache arrives here as an empty directory. Reinstalling
# costs about a minute; failing costs the whole pipeline. A missing .nix-cache
# needs no step of its own: nix just falls back to cache.nixos.org.
.restore-node:
  script:
    - |
      if [ ! -d node_modules ]; then
        echo "node_modules/ was not restored from the cache; installing it."
        nix develop --command npm ci --ignore-scripts
      fi

.restore-composer:
  script:
    - |
      if [ ! -d vendor ]; then
        echo "vendor/ was not restored from the cache; installing it."
        nix develop --command composer install --no-interaction --quiet
      fi

### Base images
.nix:
  image: ${DOCKERHUB_IMAGE_PREFIX}nixos/nix:2.34.7@sha256:898e3874bc80a8fbd7df6001b6c83d6e0c904a942e3a4cdf8a89881458333cac
  variables:
    NIX_CONFIG: "extra-experimental-features = nix-command flakes"
  cache:
    - *cache-nix
  before_script:
    - |
      # Repeating extra-substituters in nix.conf overrides the previous value
      # instead of appending, so every cache goes on one line. Jobs restore
      # different caches and the first pipeline restores none, so only
      # directories nix copy has actually written are listed.
      substituters=""

      for dir in .nix-cache .nix-browser-cache; do
        if [ -f "$dir/nix-cache-info" ]; then
          substituters="$substituters file://$PWD/$dir"
        fi
      done

      if [ -n "$substituters" ]; then
        echo "extra-substituters =$substituters" >> /etc/nix/nix.conf
        echo "extra-trusted-substituters =$substituters" >> /etc/nix/nix.conf
        # install:nix builds a handful of paths itself (fonts.conf, composer,
        # php-with-extensions, the shell wrappers) and they land in the cache
        # unsigned, so every job would discard them and rebuild. Nothing here
        # is trusted on its content anyway: the caches are directories this
        # pipeline just wrote, inside a container that is thrown away after.
        echo "require-sigs = false" >> /etc/nix/nix.conf
      fi

  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Node tooling only: no vendor/.
.nix-node:
  extends: .nix
  cache:
    - *cache-nix
    - *cache-node
  before_script:
    - !reference [.nix, before_script]
    - !reference [.restore-node, script]

# PHP tooling only: no node_modules/.
.nix-php:
  extends: .nix
  cache:
    - *cache-nix
    - *cache-composer
  before_script:
    - !reference [.nix, before_script]
    - !reference [.restore-composer, script]

.nix-full:
  extends: .nix
  cache:
    - *cache-nix
    - *cache-node
    - *cache-composer
  before_script:
    - !reference [.nix, before_script]
    - !reference [.restore-node, script]
    - !reference [.restore-composer, script]

.ssh:
  stage: deploy
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  needs: []
  before_script:
    - apk add --update openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  interruptible: false

.deploy:
  extends: .ssh
  script:
    - |
      ssh "${SSH_USER}@${SSH_HOSTNAME}" bash -o errexit -o xtrace <<EOT
      cd $SSH_GIT_DIR
      git fetch $CI_REPOSITORY_URL $CI_COMMIT_SHA
      git checkout FETCH_HEAD
      scripts/deploy.sh $BUILD_PREFIX
      EOT
  resource_group: $SSH_HOSTNAME
  when: manual

### install stage
install:nix:
  extends: .nix
  stage: install
  needs: []
  variables:
    # All four caches are keyed on nothing but the lock files listed in the
    # rules below, so when none of them changed a push would overwrite an
    # identical object. Restoring is ~7 s and pushing is ~40 s of the runner's
    # time plus ~1.5 GiB to cache storage, so the default is not to push.
    CACHE_POLICY: pull
    # Only the scheduled warm-cache run rewrites the nix caches from empty.
    COMPACT_CACHE: "false"
  rules:
    # Everything merges here, so this is what keeps the caches that merge
    # requests branch from alive, and it recovers an evicted cache without
    # anyone noticing. It is off the critical path of merge request feedback.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    # A backstop for the case where nothing has merged in a while. Needs a
    # pipeline schedule with SCHEDULE_TASK=warm-cache.
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'warm-cache'
      variables:
        CACHE_POLICY: pull-push
        COMPACT_CACHE: "true"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - flake.lock
        - flake.nix
        - composer.lock
        - package-lock.json
      variables:
        CACHE_POLICY: pull-push
    # For refilling a wiped cache right now rather than waiting for the next
    # merge or the nightly schedule. Run a pipeline with REBUILD_CACHE=true.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $REBUILD_CACHE == 'true'
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  cache:
    - <<: *cache-nix
      policy: $CACHE_POLICY
    - <<: *cache-nix-browser
      policy: $CACHE_POLICY
    - <<: *cache-composer
      policy: $CACHE_POLICY
    - <<: *cache-node
      policy: $CACHE_POLICY
  script:
    - |
      if [ "$CACHE_POLICY" = pull ]; then
        # Nothing built here would be uploaded, so the only work left worth
        # doing is checking that what the rest of the pipeline reads came back.
        missing=""

        [ -f .nix-cache/nix-cache-info ] || missing="$missing .nix-cache"
        [ -f .nix-browser-cache/nix-cache-info ] || missing="$missing .nix-browser-cache"
        [ -d vendor ] || missing="$missing vendor"
        [ -d node_modules ] || missing="$missing node_modules"

        if [ -n "$missing" ]; then
          # Not fatal any more: the lint and test jobs reinstall what they need,
          # so the pipeline is slower but still correct.
          echo "Not restored from the cache:$missing"
          echo "No lock file changed here, so this pipeline cannot refill it. The next"
          echo "default-branch pipeline or the warm-cache schedule will. To refill it"
          echo "now, re-run this pipeline with the variable REBUILD_CACHE=true."
          exit 0
        fi

        echo "All four caches restored, and no lock file changed. Nothing to build."
        exit 0
      fi

    - nix develop --command composer install --no-interaction --quiet
    - nix develop --command npm ci --ignore-scripts
    # --out-link roots both shells, so nothing can collect them between the
    # build and the copy. `nix copy` walks each closure on its own.
    - nix build .#devShells.x86_64-linux.default --out-link /tmp/devshell-default
    - nix build .#devShells.x86_64-linux.browser --out-link /tmp/devshell-browser
    - |
      # `nix copy` skips paths the destination already holds, which is what
      # keeps an ordinary push cheap -- rewriting both caches from empty costs
      # ~7 minutes of NAR compression. The flip side is that old closures
      # accumulate as lock files move, and a fallback_keys hit seeds the
      # directory with an older closure by design. So the scheduled run, and
      # only the scheduled run, starts from empty and compacts them back to one
      # closure each. The store paths are local by now, so nothing needs these
      # directories any more.
      if [ "$COMPACT_CACHE" = "true" ]; then
        echo "Compacting: rewriting both nix caches from empty."
        rm --recursive --force "$CI_PROJECT_DIR/.nix-cache" "$CI_PROJECT_DIR/.nix-browser-cache"
      fi
    - nix copy --to "file://$CI_PROJECT_DIR/.nix-cache" --no-check-sigs /tmp/devshell-default
    - |
      # A binary cache has to be closure-complete, so this one repeats the
      # default shell's paths instead of carrying only the Playwright
      # difference. That makes it self-contained: the browser job restores this
      # cache alone, and no other job pays for the ~2 GiB it holds.
      nix copy --to "file://$CI_PROJECT_DIR/.nix-browser-cache" --no-check-sigs /tmp/devshell-browser

# Publishes what install:nix just built under the fixed keys the fallback_keys
# above point at. A job of its own rather than two more cache entries on
# install:nix: those would be restored by every pipeline that reads the
# lock-file-keyed caches, which is ~930 MiB unpacked into directories that are
# already populated, to serve a copy nothing in that pipeline reads. The rules
# here also make the write impossible from a branch, where a lock file of its
# own would hand every other branch the wrong fallback.
warm:main-cache:
  extends: .nix
  stage: install
  needs:
    - job: install:nix
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'warm-cache'
  cache:
    # Restored from the keys install:nix wrote a moment ago, then republished
    # below under the stable names. `push` means these two are never downloaded.
    - *cache-nix
    - *cache-nix-browser
    - key: nix-store-main
      paths:
        - .nix-cache/
      policy: push
    - key: nix-store-browser-main
      paths:
        - .nix-browser-cache/
      policy: push
  script:
    - |
      # A cache is only uploaded when the job succeeds, so failing here is what
      # stops an empty directory from replacing a good fallback.
      for dir in .nix-cache .nix-browser-cache; do
        if [ ! -f "$dir/nix-cache-info" ]; then
          echo "$dir was not restored, so there is nothing to publish as a fallback."
          echo "install:nix should have written it in this same pipeline."
          exit 1
        fi
      done

      echo "Publishing both nix caches under nix-store-main and nix-store-browser-main."

### Lint stage
commitlint:
  extends: .nix-node
  stage: lint
  variables:
    GIT_DEPTH: "0"
  script:
    - nix develop --command node_modules/.bin/commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA

# tsconfig resolves ziggy-js inside vendor/, and type-aware rules follow
# that import, so this one needs both dependency caches.
eslint:
  extends: .nix-full
  stage: lint
  script:
    - nix develop --command npm run eslint

gitleaks:
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  stage: lint
  needs: []
  script: gitleaks git --platform=gitlab --log-opts=$CI_MERGE_REQUEST_DIFF_BASE_SHA..
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

phpstan:
  extends: .nix-php
  stage: lint
  script:
    - nix develop --command vendor/bin/phpstan --no-progress

pint:
  extends: .nix-php
  stage: lint
  script:
    - nix develop --command vendor/bin/pint --test

prettier:
  extends: .nix-node
  stage: lint
  script:
    - nix develop --command npm run format:check

rector:
  extends: .nix-php
  stage: lint
  script:
    - nix develop --command vendor/bin/rector --dry-run --no-progress-bar

stylelint:
  extends: .nix-node
  stage: lint
  script:
    - nix develop --command npm run stylelint

# vue-tsc resolves ziggy-js inside vendor/, so this one needs both caches too.
typescript:
  extends: .nix-full
  stage: lint
  script:
    - nix develop --command npm run typecheck

# vite shells out to `php artisan ziggy:generate` and aliases ziggy-js into
# vendor/, so this one needs both dependency caches.
frontend-build:
  extends: .nix-full
  stage: build
  needs:
    - install:nix
  variables:
    APP_URL: http://127.0.0.1:$BROWSER_SERVER_PORT
    VITE_REVERB_PORT: $BROWSER_REVERB_PORT
  script:
    - nix develop --command scripts/build-frontend-assets.sh
  artifacts:
    expire_in: 1 week
    paths:
      - public/build/

### Test stage
coverage:
  extends: .nix-php
  stage: test
  coverage: '/Total:\s+(\d+(?:\.\d+)?)\s*\%/'
  needs:
    - job: frontend-build
      artifacts: true
  script:
    - mkdir --parents build/coverage
    - nix develop --command composer run coverage

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura.xml
    paths:
      - build/coverage/

browser:
  extends: .nix
  stage: test
  needs:
    - job: frontend-build
      artifacts: true
  # The only job that launches a browser, so the only one that pulls the
  # Playwright closure on top of the default shell.
  cache:
    # The browser cache is closure-complete, so *cache-nix would only be a
    # second copy of paths this job already gets from it.
    - *cache-nix-browser
    - *cache-node
    - *cache-composer
  before_script:
    - !reference [.nix, before_script]
    - !reference [.restore-node, script]
    - !reference [.restore-composer, script]
  variables:
    SKIP_FRONTEND_BUILD: "1"
  # Browser tests stall rather than slow down when the runner is busy, because
  # every Pest worker talks to one shared `playwright run-server`. Running a
  # single browser job at a time keeps the machine out of the state that
  # triggers it, at the cost of queueing this job across merge requests.
  resource_group: browser
  script:
    - nix develop .#browser --command composer run test:browser

vitest:
  extends: .nix-node
  stage: test
  needs:
    - install:nix
  script:
    - nix develop --command npm run test

### Deploy stage
deploy-staging:
  extends: .deploy
  environment:
    name: staging
    url: https://roomz.onit-ub.tu-berlin.de

deploy-demo:
  extends: .deploy
  environment:
    name: demo
    url: https://demo.ub.tu-berlin.de/bibroomz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  manual_confirmation: Deploy to demo server?

import-database:
  stage: deploy
  image: ${DOCKERHUB_IMAGE_PREFIX}alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
  needs: []
  environment:
    name: import-database
    action: access
  before_script:
    - apk add --update bash openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SOURCE_SSH_PRIVATE_KEY" "$TARGET_SSH_PRIVATE_KEY"
    - ssh-add "$SOURCE_SSH_PRIVATE_KEY"
    - ssh-add "$TARGET_SSH_PRIVATE_KEY"
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - cat "$SOURCE_SSH_KNOWN_HOSTS" "$TARGET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - scripts/db-import.sh
  resource_group: $TARGET_SSH_HOSTNAME
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $SCHEDULE_TASK == 'import-database'
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
