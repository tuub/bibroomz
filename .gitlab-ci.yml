workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^dependabot\/.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

include:
  component: $CI_SERVER_FQDN/ub/onit/gitlab-ci-components/dependency-scanning@main

stages:
  - automation
  - build
  - lint
  - test
  - deploy

default:
  interruptible: true

### Automation stage
dependabot:
  stage: automation
  image: alpine:latest
  script:
    - apk add --no-cache curl jq
    - |
      TARGET_BRANCH="${CI_DEFAULT_BRANCH}"

      existing="$(curl --silent --show-error \
        --get \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "state=opened" \
        --data-urlencode "source_branch=$CI_COMMIT_BRANCH" \
        --data-urlencode "target_branch=$TARGET_BRANCH" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"

      iid="$(echo "$existing" | jq -r '.[0].iid // empty')"

      if [ -z "$iid" ]; then
        created="$(curl --silent --show-error --fail \
          --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data-urlencode "source_branch=$CI_COMMIT_BRANCH" \
          --data-urlencode "target_branch=$TARGET_BRANCH" \
          --data-urlencode "title=chore(deps): $CI_COMMIT_BRANCH" \
          --data-urlencode "remove_source_branch=true" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"
        iid="$(echo "$created" | jq -r '.iid')"
      fi

      curl --silent --show-error --fail \
        --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "auto_merge=true" \
        --data-urlencode "should_remove_source_branch=true" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$iid/merge"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^dependabot\/.*/

### Base images
.node:
  image: node:22-alpine
  cache:
    - key:
        files:
          - package-lock.json
        prefix: node
      paths:
        - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.php:
  image: php:8.3-alpine
  cache:
    - key:
        files:
          - composer-lock.json
        prefix: composer
      paths:
        - vendor/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --update openssh
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh "${SSH_USER}@${SSH_HOSTNAME}" bash -ex <<EOT
      cd $SSH_GIT_DIR
      git fetch $CI_REPOSITORY_URL $CI_COMMIT_SHA
      git checkout FETCH_HEAD
      scripts/deploy.sh $BUILD_PREFIX
      EOT
  resource_group: $SSH_HOSTNAME
  interruptible: false
  when: manual

### Build stage
composer:
  extends: .php
  stage: build
  before_script:
    - EXPECTED_CHECKSUM="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
    - test "$EXPECTED_CHECKSUM" == "$ACTUAL_CHECKSUM"
    - php composer-setup.php
  script:
    - php composer.phar install --ignore-platform-reqs

node:
  extends: .node
  stage: build
  before_script:
    - apk add --no-cache git
  script:
    - npm ci

### Lint stage
commitlint:
  extends: .node
  stage: lint
  script:
    - npx --no -- commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA

eslint:
  extends: .node
  stage: lint
  script:
    - npx --no -- eslint resources/js/**/*.{js,ts,vue}

gitleaks:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script: gitleaks git --platform=gitlab --log-opts=$CI_MERGE_REQUEST_DIFF_BASE_SHA..
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

phpcs:
  extends: .php
  stage: lint
  script:
    - vendor/bin/phpcs

prettier:
  extends: .node
  stage: lint
  script:
    - npx --no -- prettier --list-different resources/js resources/sass

renovate:
  extends: .node
  stage: lint
  script:
    - npx --no --package renovate -- renovate-config-validator --strict

stylelint:
  extends: .node
  stage: lint
  script:
    - npx --no -- stylelint resources/{js,sass}/**/*.{css,sass,vue}

### Test stage
dusk:
  stage: test
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKER_REGISTRY_PASS" | docker login --username "$DOCKER_REGISTRY_USER" --password-stdin
    - cp .env.dusk.compose .env
  script:
    - docker compose --file compose.testing.yaml up --abort-on-container-exit --exit-code-from dusk --attach dusk
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  resource_group: project-pipeline

### Deploy stage
deploy-staging:
  extends: .deploy
  environment:
    name: staging
    url: https://roomz.onit-ub.tu-berlin.de

deploy-demo:
  extends: .deploy
  environment:
    name: demo
    url: https://demo.ub.tu-berlin.de/bibroomz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  manual_confirmation: Deploy to demo server?
