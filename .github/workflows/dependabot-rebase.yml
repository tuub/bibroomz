name: Rebase dependency update branches

on:
  push:
    branches:
      - main

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase its open PRs onto main
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          # The push that runs this workflow can be the merge itself: the
          # mirror merges fast-forward, so the pull request's own commits
          # arrive on main and GitHub closes it as merged. That takes a moment,
          # and --state open still lists the pull request until it does, which
          # leaves an "@dependabot rebase" comment on a merged pull request.
          # Dependabot ignores it, but the comment stays.
          #
          # Waiting for the state to flip would only narrow the window. Since
          # the merge is fast-forward, the head commit reaches main unchanged,
          # so a pull request that is already in carries a head main contains,
          # which compare reports as identical or behind.
          gh pr list --repo "$REPO" --state open --author "app/dependabot" \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"' |
            while read -r pr sha; do
              if ! status="$(gh api "repos/$REPO/compare/$BASE...$sha" --jq '.status')"; then
                echo "Could not compare PR #$pr against $BASE; leaving it alone."
                continue
              fi

              case "$status" in
                identical | behind)
                  echo "PR #$pr is already in $BASE; not asking for a rebase."
                  continue
                  ;;
              esac

              gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
            done

      - name: Rebase the flake.lock PR onto main
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          BRANCH: dependabot/nix/flake-lock
        run: |
          # update-flake-lock creates this branch as github-actions[bot], so
          # Dependabot cannot act on it. Update it directly when main has
          # moved since the pull request was created.
          gh pr list --repo "$REPO" --state open --base "$BASE" --head "$BRANCH" \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"' |
            while read -r pr sha; do
              if ! status="$(gh api "repos/$REPO/compare/$BASE...$sha" --jq '.status')"; then
                echo "Could not compare PR #$pr against $BASE; leaving it alone."
                continue
              fi

              case "$status" in
                diverged)
                  gh pr update-branch "$pr" --repo "$REPO" --rebase
                  ;;
                ahead)
                  echo "PR #$pr is already based on $BASE."
                  ;;
                identical | behind)
                  echo "PR #$pr is already in $BASE; not rebasing it."
                  ;;
              esac
            done
